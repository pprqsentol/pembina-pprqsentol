<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Aplikasi Pembina - Roudhotul Qur'an</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b5940">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<div id="loginScreen" class="screen">
  <div class="login-box">
    <img src="icon-192.png" class="login-logo" alt="Logo Pondok">
    <h1>Aplikasi Pembina</h1>
    <p class="muted">Roudhotul Qur'an</p>
    <label>Email</label>
    <input id="loginEmail" type="email" autocomplete="username" placeholder="hafalan@pprqsentol.com" onkeydown="if(event.key==='Enter') doLogin()" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);font-size:16px;box-sizing:border-box;">
    <label style="margin-top:8px">Password</label>
    <input id="loginPassword" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);font-size:16px;box-sizing:border-box;">
    <p id="loginError" class="muted" style="color:var(--danger);display:none;margin-top:8px"></p>
    <button class="btn-primary" id="btnMasuk" onclick="doLogin()">Masuk</button>
  </div>
</div>

<div id="app" class="screen" style="display:none">
  <header class="topbar">
    <img src="icon-192.png" class="topbar-logo" alt="">
    <div>
      <div class="topbar-title">Aplikasi Pembina</div>
      <div class="topbar-sub" id="userLabel"></div>
    </div>
    <button class="icon-btn" onclick="logout()" title="Keluar"><i>&#8631;</i></button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>

    <main class="content" id="content"></main>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div id="modalRoot"></div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
